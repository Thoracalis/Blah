[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-defense"
version = "0.1.0"
description = "Air Defense Resilience Simulator – abstract pedagogical model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29",
    "networkx>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "stable-baselines3>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "tensorboard>=2.17",
    "rich>=13.7",          # pretty terminal output for Step 1
]

[project.optional-dependencies]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
