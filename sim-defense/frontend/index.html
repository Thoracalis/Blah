<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIR DEFENSE C2 // SIMULATOR</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app">

  <!-- ====== HEADER ====== -->
  <header id="header" class="panel" style="grid-area:header;flex-direction:row;display:flex;align-items:center;gap:24px;padding:0 16px;border-bottom:1px solid var(--border-bright);background:var(--bg-secondary);">
    <span class="classified">⚠ UNCLASSIFIED – SIMULATION ONLY</span>
    <span class="title">AIR DEFENSE RESILIENCE SIMULATOR // C2 DISPLAY</span>

    <div class="metric-group">
      <div class="metric">
        <span class="metric-label">DEFENSE CAP</span>
        <span class="metric-value" id="metric-defense">–</span>
      </div>
      <div class="metric">
        <span class="metric-label">STOP RATE</span>
        <span class="metric-value" id="metric-stop-rate">–</span>
      </div>
      <div class="metric">
        <span class="metric-label">ACTIVE HOT</span>
        <span class="metric-value" id="metric-threats">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">SORTIES</span>
        <span class="metric-value" id="metric-sorties">–</span>
      </div>
    </div>

    <span id="clock">–</span>
    <span id="conn-status" class="conn-status connecting">● CONNECTING</span>
  </header>

  <!-- ====== LEFT PANEL ====== -->
  <aside id="panel-left" class="panel" style="grid-area:left;overflow-y:auto;">
    <div class="panel-title">FRIENDLY FORCES</div>
    <div id="unit-list"></div>
  </aside>

  <!-- ====== MAP ====== -->
  <main id="map-area" style="grid-area:map;position:relative;overflow:hidden;background:var(--bg-primary);">
    <canvas id="map-canvas"></canvas>

    <!-- Node popup -->
    <div id="node-popup">
      <h3>NODE_ID</h3>
      <div class="popup-rows"></div>
    </div>

    <!-- Map toggle buttons overlay -->
    <div style="position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:20;">
      <button class="toggle-btn on"  id="toggle-edges">CMD LINKS</button>
      <button class="toggle-btn on"  id="toggle-radar">RADAR</button>
      <button class="toggle-btn"     id="toggle-logistics">LOGISTICS</button>
      <button class="toggle-btn on"  id="toggle-sensors">SENSOR</button>
    </div>

    <!-- Episode ID overlay -->
    <div style="position:absolute;bottom:8px;right:8px;font-size:9px;color:rgba(0,180,200,0.4);letter-spacing:2px;z-index:20;" id="ep-id-label">–</div>
  </main>

  <!-- ====== RIGHT PANEL ====== -->
  <aside id="panel-right" class="panel" style="grid-area:right;display:flex;flex-direction:column;">
    <div class="panel-title">EVENT LOG</div>
    <div id="event-log"></div>
  </aside>

  <!-- ====== FOOTER ====== -->
  <footer id="footer" style="grid-area:footer;background:var(--bg-secondary);border-top:1px solid var(--border-bright);display:flex;align-items:center;padding:0 16px;gap:12px;">
    <button class="ctrl-btn" id="btn-play">▶ PLAY</button>
    <button class="ctrl-btn" id="btn-pause">⏸ PAUSE</button>
    <button class="ctrl-btn" id="btn-reset">↺ RESET</button>

    <span style="font-size:10px;color:var(--white-dim);letter-spacing:1px;">SPEED</span>
    <input id="speed-slider" type="range" min="0.1" max="10" step="0.1" value="1.0">
    <span id="speed-label" style="font-size:10px;color:var(--white-dim);min-width:32px;">1.0×</span>

    <div id="timeline">
      <div id="timeline-fill"></div>
      <span id="timeline-label">T+0000 / 150</span>
    </div>
  </footer>

</div><!-- #app -->

<!-- Disclaimer -->
<div id="disclaimer">
  ⚠ FICTIONAL SIMULATION – No real military data. Educational / research tool only.
</div>

<script src="/static/map.js"></script>
<script src="/static/c2.js"></script>
</body>
</html>
